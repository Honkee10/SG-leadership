<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SG Leadership</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-dark: #1d4ed8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef4ff, var(--bg));
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .card {
        width: min(90vw, 720px);
        background: var(--card);
        border-radius: 18px;
        box-shadow: 0 12px 32px rgba(37, 99, 235, 0.12);
        padding: 2.5rem;
        text-align: center;
      }

      .badge {
        display: inline-block;
        background: rgba(37, 99, 235, 0.12);
        color: var(--accent-dark);
        padding: 0.5rem 0.85rem;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(2.25rem, 5vw, 4rem);
        margin: 1rem 0 0.75rem;
      }

      p {
        font-size: 1.1rem;
        color: var(--muted);
        line-height: 1.7;
        margin: 0 auto;
        max-width: 52ch;
      }

      .button {
        display: inline-block;
        margin-top: 1.5rem;
        background: var(--accent);
        color: white;
        text-decoration: none;
        padding: 0.9rem 1.5rem;
        border-radius: 12px;
        font-weight: 700;
        transition: background 0.2s ease;
      }

      .button:hover {
        background: var(--accent-dark);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Welcome</div>
      <h1>SG Leadership</h1>
      <p>
        This page was added to the repository as a simple HTML landing page for the
        SG Leadership project.
      </p>
      <a class="button" href="#">Learn More</a>
    </main>
  </body>
</html>
